<!DOCTYPE html>
<html>
<head>
    <title>Result</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background: linear-gradient(120deg, #f1f8e9, #e3f2fd);
        }

        .card {
            border-radius: 15px;
        }
    </style>
</head>

<body>

<div class="container mt-4">

    <div class="card p-4 text-center shadow">

        <h3>🏁 Quiz Completed</h3>

        <h5>
            Score: <span class="text-success">{{score}}</span> / {{total}}
        </h5>

        <!-- SMALL CHART -->
        <div style="width:200px; height:200px; margin:auto;">
            <canvas id="chart"></canvas>
        </div>

        <a href="/" class="btn btn-primary mt-3">Play Again</a>

    </div>

    <!-- REVIEW -->
    <div class="card mt-4 p-3 shadow">

        <h5>📊 Review</h5>

        {% for a in answers %}
        <div class="border rounded p-2 mt-2">

            <b>{{a.q}}</b><br>

            {% if a.selected == a.correct %}
                <span class="text-success">✔ {{a.selected}}</span>
            {% else %}
                <span class="text-danger">❌ {{a.selected}}</span>
            {% endif %}

            <br>
            <small>Correct: {{a.correct}}</small>

        </div>
        {% endfor %}

    </div>

</div>

<script src="{{ url_for('static', filename='chart.js') }}"></script>
<script>
    loadChart({{score}}, {{total}});
</script>

</body>
</html>
